                                <option value="1" ${currentEtape === 1 ? 'selected' : ''}>Étape 1 - 25%</option>
                                <option value="2" ${currentEtape === 2 ? 'selected' : ''}>Étape 2 - 50%</option>
                                <option value="3" ${currentEtape === 3 ? 'selected' : ''}>Étape 3 - 75%</option>
                                <option value="4" ${currentEtape === 4 ? 'selected' : ''}>Étape 4 - Feu Vert (100%)</option>
                            </select>
                            <button class="btn-action" onclick="window.validerEtape('${project.id}')">
                                <i class="bi bi-check-lg"></i> Valider l'étape
                            </button>
                        </div>
                        
                        <div style="margin-top:15px;">
                            <label class="form-label">Progression : ${pourcentage}%</label>
                            <div style="height:25px;background:#e9ecef;border-radius:12px;overflow:hidden;">
                                <div style="height:100%;width:${pourcentage}%;background:${pourcentage >= 100 ? '#28a745' : '#ffb347'};transition:width 0.5s;"></div>
                            </div>
                        </div>
                    </div>
                `;
            };
            
            window.validerEtape = async function(projectId) {
                const select = document.getElementById('etapeSelect');
                if (!select) return;
                const nouvelleEtape = parseInt(select.value);
                
                if (!anneeActiveActuelle) {
                    showToast('Aucune année active', 'danger');
                    return;
                }
                
                try {
                    await db.collection('projets').doc(projectId).update({
                        etape: nouvelleEtape,
                        anneeAcademiqueId: anneeActiveActuelle.id,
                        anneeAcademiqueNom: anneeActiveActuelle.anneeNom,
                        derniereMiseAJour: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    showToast(`✅ Étape ${nouvelleEtape * 25}% validée !`, 'success');
                    window.displayProjectDetail(projectId);
                } catch(e) {
                    showToast('❌ Erreur: ' + e.message, 'danger');
                }
            };
        }
        
        // ============================================================
        // ⭐ VUE : PUBLICATIONS DE SUJETS
        // ============================================================
        function renderPublicationsView(container) {
            const DEPARTEMENTS = [
                "Agronomie Générale", "Économie Agricole", "Sciences du Sol",
                "Protection des Végétaux", "Zootechnie", "Génie Rural"
            ];
            
            const anneeLabel = anneeActiveActuelle ? anneeActiveActuelle.anneeNom : '-';
            
            container.innerHTML = `
                <div class="spa-view active">
                    <div class="view-header">
                        <h4><i class="bi bi-megaphone-fill"></i> Publication de Sujets</h4>
                        <button class="btn-back-view" onclick="loadView('home')">
                            <i class="bi bi-arrow-left"></i> Accueil
                        </button>
                    </div>
                    
                    <div class="content-card">
                        <h5 style="color:var(--primary-blue);">Publier un nouveau sujet</h5>
                        <p style="color:#888;font-size:13px;">
                            Année active : <strong>${escapeHtml(anneeLabel)}</strong>
                        </p>
                        
                        <form id="publicationForm">
                            <div class="mb-3">
                                <label class="form-label">Département *</label>
                                <select class="form-select" id="sujetDepartement" required>
                                    <option value="">-- Sélectionner --</option>
                                    ${DEPARTEMENTS.map(d => `<option value="${d}">${d}</option>`).join('')}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Titre du sujet *</label>
                                <input type="text" class="form-control" id="sujetTitre" required minlength="10" placeholder="Ex: Étude des sols...">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description *</label>
                                <textarea class="form-control" id="sujetDescription" rows="5" required minlength="20"></textarea>
                            </div>
                            <button type="submit" class="btn-primary-custom" style="width:100%;" id="publishSujetBtn">
                                <i class="bi bi-cloud-upload-fill"></i> Publier le sujet
                            </button>
                        </form>
                    </div>
                    
                    <div class="content-card">
                        <h5 style="color:var(--primary-blue);">Mes sujets publiés</h5>
                        <div id="sujetsList">
                            <div class="spa-loading"><div class="spinner"></div><p>Chargement...</p></div>
                        </div>
                    </div>
                </div>
            `;
            
            initPublicationsView(DEPARTEMENTS);
            
            function initPublicationsView(depts) {
                const form = document.getElementById('publicationForm');
                const currentUserId = currentProfessor.id || currentProfessor.uid;
                
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const dept = document.getElementById('sujetDepartement').value;
                    const titre = document.getElementById('sujetTitre').value.trim();
                    const desc = document.getElementById('sujetDescription').value.trim();
                    
                    if (!dept || titre.length < 10 || desc.length < 20) {
                        showToast('Vérifiez les champs', 'warning');
                        return;
                    }
                    
                    if (!anneeActiveActuelle) {
                        showToast('Aucune année active', 'danger');
                        return;
                    }
                    
                    const btn = document.getElementById('publishSujetBtn');
                    btn.disabled = true;
                    btn.innerHTML = '⏳ Publication...';
                    
                    try {
                        await db.collection('sujets').add({
                            professeurId: currentUserId,
                            professeurNom: currentProfessor.nomComplet || 'Professeur',
                            professeurEmail: currentProfessor.email || '',
                            departement: dept,
                            titre: titre,
                            description: desc,
                            statut: 'publie',
                            anneeAcademiqueId: anneeActiveActuelle.id,
                            anneeAcademiqueNom: anneeActiveActuelle.anneeNom,
                            datePublication: firebase.firestore.FieldValue.serverTimestamp(),
                            nbEtudiants: 0
                        });
                        
                        showToast('✅ Sujet publié !', 'success');
                        form.reset();
                    } catch(err) {
                        showToast('❌ Erreur: ' + err.message, 'danger');
                    } finally {
                        btn.disabled = false;
                        btn.innerHTML = '<i class="bi bi-cloud-upload-fill"></i> Publier le sujet';
                    }
                });
                
                const unsub = db.collection('sujets')
                    .where('professeurId', '==', currentUserId)
                    .onSnapshot(snap => {
                        professorSubjects = [];
                        snap.forEach(doc => {
                            const data = doc.data();
                            if (appartientAnneeActive(data)) {
                                professorSubjects.push({ id: doc.id, ...data });
                            }
                        });
                        
                        professorSubjects.sort((a, b) => {
                            const da = a.datePublication?.toDate?.() || new Date(0);
                            const db2 = b.datePublication?.toDate?.() || new Date(0);
                            return db2 - da;
                        });
                        
                        afficherSujetsPubliés();
                    });
                registerListener(unsub);
                
                function afficherSujetsPubliés() {
                    const list = document.getElementById('sujetsList');
                    if (!list) return;
                    
                    if (professorSubjects.length === 0) {
                        list.innerHTML = `<div class="empty-state"><i class="bi bi-inbox"></i><p>Aucun sujet publié</p></div>`;
                        return;
                    }
                    
                    let html = '';
                    professorSubjects.forEach(s => {
                        const anneeNom = s.anneeAcademiqueNom || anneeLabel;
                        html += `
                            <div class="student-detail-card" style="margin-bottom:10px;">
                                <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
                                    <div style="flex:1;min-width:200px;">
                                        <strong style="color:var(--primary-blue);">${escapeHtml(s.titre)}</strong>
                                        <div style="font-size:13px;color:#666;"><i class="bi bi-building"></i> ${escapeHtml(s.departement)}</div>
                                        <div style="font-size:12px;color:#888;"><i class="bi bi-calendar3"></i> ${formaterDate(s.datePublication)}</div>
                                        <span class="badge-annee" style="margin-top:5px;display:inline-block;">${escapeHtml(anneeNom)}</span>
                                    </div>
                                    <div>
                                        <span style="background:#d4edda;color:#155724;padding:4px 14px;border-radius:20px;font-size:12px;">Publié</span>
                                        <button class="btn-publish" style="padding:4px 10px;font-size:12px;margin-left:5px;" onclick="window.supprimerSujet('${s.id}')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    list.innerHTML = html;
                }
            }
            
            window.supprimerSujet = async function(id) {
                if (!confirm('Supprimer ce sujet ?')) return;
                try {
                    await db.collection('sujets').doc(id).delete();
                    showToast('✅ Sujet supprimé', 'success');
                } catch(e) {
                    showToast('❌ Erreur: ' + e.message, 'danger');
                }
            };
        }
        
        // ============================================================
        // ⭐ VUE : PROFIL
        // ============================================================
        function renderProfilView(container) {
            const nomComplet = currentProfessor.nomComplet || 'Professeur';
            const initials = nomComplet.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            
            container.innerHTML = `
                <div class="spa-view active">
                    <div class="view-header">
                        <h4><i class="bi bi-person-circle"></i> Mon Profil</h4>
                        <button class="btn-back-view" onclick="loadView('home')">
                            <i class="bi bi-arrow-left"></i> Accueil
                        </button>
                    </div>
                    
                    <div class="profile-container">
                        <div class="profile-header">
                            <div class="profile-avatar">${initials}</div>
                            <h3 class="profile-name">${escapeHtml(nomComplet)}</h3>
                            <div>
                                <span class="profile-role"><i class="bi bi-person-workspace"></i> Professeur</span>
                                <span class="profile-status"><i class="bi bi-circle-fill" style="font-size:8px;"></i> Compte Actif</span>
                            </div>
                        </div>
                        
                        <div class="profile-details">
                            <h5 style="color:var(--primary-blue);margin-bottom:15px;">
                                <i class="bi bi-info-circle-fill"></i> Informations personnelles
                            </h5>
                            
                            <div class="detail-item">
                                <div class="detail-icon"><i class="bi bi-person-fill"></i></div>
                                <div class="detail-content">
                                    <div class="detail-label">Nom complet</div>
                                    <div class="detail-value">${escapeHtml(nomComplet)}</div>
                                </div>
                            </div>
                            
                            <div class="detail-item">
                                <div class="detail-icon"><i class="bi bi-envelope-fill"></i></div>
                                <div class="detail-content">
                                    <div class="detail-label">Email</div>
                                    <div class="detail-value">${escapeHtml(currentProfessor.email || '-')}</div>
                                </div>
                            </div>
                            
                            <div class="detail-item">
                                <div class="detail-icon"><i class="bi bi-fingerprint"></i></div>
                                <div class="detail-content">
                                    <div class="detail-label">ID Professeur</div>
                                    <div class="detail-value" style="font-family:monospace;font-size:13px;">${escapeHtml(currentProfessor.id || currentProfessor.uid || '-')}</div>
                                </div>
                            </div>
                            
                            <div class="detail-item">
                                <div class="detail-icon"><i class="bi bi-telephone-fill"></i></div>
                                <div class="detail-content">
                                    <div class="detail-label">Téléphone</div>
                                    <div class="detail-value" id="detailTelephone">${escapeHtml(currentProfessor.telephone || 'Non renseigné')}</div>
                                </div>
                            </div>
                            
                            <div class="detail-item">
                                <div class="detail-icon"><i class="bi bi-bookmark-fill"></i></div>
                                <div class="detail-content">
                                    <div class="detail-label">Spécialité</div>
                                    <div class="detail-value" id="detailSpecialite">${escapeHtml(currentProfessor.specialite || 'Non renseignée')}</div>
                                </div>
                            </div>
                            
                            <div class="detail-item">
                                <div class="detail-icon"><i class="bi bi-building"></i></div>
                                <div class="detail-content">
                                    <div class="detail-label">Département</div>
                                    <div class="detail-value" id="detailDepartement">${escapeHtml(currentProfessor.departement || 'Non renseigné')}</div>
                                </div>
                            </div>
                        </div>
                        
                        <div style="background:linear-gradient(135deg,#f8f9fa,#e9ecef);border-radius:15px;padding:25px;margin-top:30px;border:1px solid #dee2e6;">
                            <h5 style="color:var(--primary-blue);margin-bottom:20px;">
                                <i class="bi bi-lock-fill"></i> Changer le mot de passe
                            </h5>
                            <form id="changePasswordForm">
                                <div class="mb-3">
                                    <label class="form-label">Nouveau mot de passe</label>
                                    <input type="password" class="form-control" id="newPassword" required minlength="6">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Confirmer</label>
                                    <input type="password" class="form-control" id="confirmNewPassword" required minlength="6">
                                </div>
                                <button type="submit" class="btn-action" style="width:100%;" id="changePasswordBtn">
                                    <i class="bi bi-shield-check"></i> Modifier
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
            
            const uid = currentProfessor.id || currentProfessor.uid;
            db.collection('utilisateurs').doc(uid).get().then(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    Object.keys(data).forEach(key => {
                        if (key !== 'uid' && key !== 'id') {
                            currentProfessor[key] = data[key];
                        }
                    });
                    
                    const elTel = document.getElementById('detailTelephone');
                    const elSpec = document.getElementById('detailSpecialite');
                    const elDept = document.getElementById('detailDepartement');
                    if (elTel) elTel.textContent = currentProfessor.telephone || 'Non renseigné';
                    if (elSpec) elSpec.textContent = currentProfessor.specialite || 'Non renseignée';
                    if (elDept) elDept.textContent = currentProfessor.departement || 'Non renseigné';
                }
            }).catch(() => {});
            
            document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPass = document.getElementById('newPassword').value;
                const confirmPass = document.getElementById('confirmNewPassword').value;
                
                if (newPass.length < 6) {
                    showToast('Minimum 6 caractères', 'warning');
                    return;
                }
                if (newPass !== confirmPass) {
                    showToast('Les mots de passe ne correspondent pas', 'danger');
                    return;
                }
                
                const btn = document.getElementById('changePasswordBtn');
                btn.disabled = true;
                btn.innerHTML = '⏳...';
                
                try {
                    await db.collection('utilisateurs').doc(uid).update({
                        motDePasse: newPass
                    });
                    
                    currentProfessor.motDePasse = newPass;
                    localStorage.setItem('professeur_session', JSON.stringify(currentProfessor));
                    showToast('✅ Mot de passe modifié !', 'success');
                    document.getElementById('changePasswordForm').reset();
                } catch(err) {
                    showToast('❌ Erreur: ' + err.message, 'danger');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-shield-check"></i> Modifier';
                }
            });
        }
        
        // ============================================================
        // ⭐ VÉRIFICATION SESSION
        // ============================================================
        (function() {
            console.log('🔍 Vérification de la session professeur...');
            
            const sessionData = localStorage.getItem('professeur_session');
            
            if(!sessionData) { 
                console.log('❌ Aucune session trouvée');
                window.location.href = 'login.html'; 
                return; 
            }
            
            try {
                const session = JSON.parse(sessionData);
                const now = Date.now();
                
                if(!session.expires || now > session.expires) {
                    console.log('⏰ Session expirée');
                    localStorage.removeItem('professeur_session');
                    window.location.href = 'login.html';
                    return;
                }
                
                if(!session.role || session.role !== 'professeur') {
                    localStorage.removeItem('professeur_session');
                    window.location.href = 'login.html';
                    return;
                }
                
                if(!session.verified2FA) {
                    localStorage.removeItem('professeur_session');
                    window.location.href = 'login.html';
                    return;
                }
                
                currentProfessor = session;
                const nomComplet = session.nomComplet || 'Professeur';
                
                console.log('✅ Session valide - Bienvenue ' + nomComplet);
                
                const navName = document.getElementById('navProfessorName');
                if(navName) navName.textContent = nomComplet;
                
                const avatar = document.getElementById('profileAvatar');
                if(avatar && nomComplet !== 'Professeur') {
                    const initials = nomComplet.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                    avatar.textContent = initials;
                }
                
                if(avatar) avatar.title = nomComplet;
                
                document.title = 'Espace Professeur - ' + nomComplet;
                
                const tempsRestantMs = session.expires - now;
                if(tempsRestantMs > 0) {
                    const tempsTexte = formaterTempsRestant(tempsRestantMs);
                    const sessionTimeNav = document.getElementById('sessionTimeRemaining');
                    if(sessionTimeNav) sessionTimeNav.textContent = tempsTexte;
                }
                
                chargerAnneeDepuisLocalStorage();
                
                chargerAnneeDirectement().then(() => {
                    const initialView = (location.hash || '#home').substring(1);
                    const validViews = ['home', 'cours', 'cotations', 'deliberation', 'horaire', 'projets', 'publications', 'profil'];
                    if (validViews.includes(initialView)) {
                        loadView(initialView);
                    } else {
                        loadView('home');
                    }
                    
                    initAnneeActive();
                });
                
                setTimeout(() => {
                    showToast('👋 Bienvenue ' + nomComplet + ' !', 'success');
                }, 800);
                
            } catch(e) {
                console.error('❌ Erreur session:', e);
                localStorage.removeItem('professeur_session');
                window.location.href = 'login.html';
            }
        })();
        
        // ============================================================
        // ⭐ NAVIGATION HISTORY
        // ============================================================
        window.addEventListener('popstate', (e) => {
            const view = (location.hash || '#home').substring(1);
            const validViews = ['home', 'cours', 'cotations', 'deliberation', 'horaire', 'projets', 'publications', 'profil'];
            if (validViews.includes(view)) {
                loadView(view);
            } else {
                loadView('home');
            }
        });
        
        // ============================================================
        // ⭐ DÉCONNEXION
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if(confirm('Voulez-vous vraiment vous déconnecter ?')) {
                nettoyerListeners();
                
                if (anneeActiveUnsubscribe) {
                    try { anneeActiveUnsubscribe(); } catch(e) {}
                    anneeActiveUnsubscribe = null;
                }
                
                try {
                    localStorage.removeItem(CACHE_KEY_ANNEE);
                } catch(e) {}
                
                localStorage.removeItem('professeur_session');
                console.log('🔓 Déconnexion effectuée');
                window.location.href = 'login.html';
            }
        });
        
        // ============================================================
        // ⭐ BOUTON HOME (navbar)
        // ============================================================
        document.getElementById('homeBrand').addEventListener('click', function(e) {
            e.preventDefault();
            loadView('home');
        });
        
        // ============================================================
        // ⭐ CLIC SUR L'AVATAR
        // ============================================================
        document.getElementById('profileAvatar').addEventListener('click', function() {
            loadView('profil');
        });
        
        // ============================================================
        // ⭐ VÉRIFICATION PÉRIODIQUE SESSION
        // ============================================================
        setInterval(() => {
            const sessionData = localStorage.getItem('professeur_session');
            if(sessionData) {
                try {
                    const session = JSON.parse(sessionData);
                    if(!session.expires || Date.now() > session.expires) {
                        console.log('⏰ Session expirée');
                        nettoyerListeners();
                        if (anneeActiveUnsubscribe) {
                            try { anneeActiveUnsubscribe(); } catch(e) {}
                        }
                        localStorage.removeItem('professeur_session');
                        window.location.href = 'login.html';
                    } else {
                        const tempsRestantMs = session.expires - Date.now();
                        if(tempsRestantMs > 0) {
                            const tempsTexte = formaterTempsRestant(tempsRestantMs);
                            const sessionTimeNav = document.getElementById('sessionTimeRemaining');
                            if(sessionTimeNav) sessionTimeNav.textContent = tempsTexte;
                        }
                    }
                } catch(e) {
                    localStorage.removeItem('professeur_session');
                    window.location.href = 'login.html';
                }
            }
        }, 30000);
        
        // ============================================================
        // ⭐ STATUT SYNCHRONISATION
        // ============================================================
        function updateSyncStatus(online = true) {
            const status = document.getElementById('syncStatus');
            if(!status) return;
            
            if(online) {
                status.className = 'sync-status';
                status.innerHTML = '<i class="bi bi-cloud-check"></i> Synchro';
            } else {
                status.className = 'sync-status offline';
                status.innerHTML = '<i class="bi bi-cloud-slash"></i> Hors ligne';
            }
        }
        
        window.addEventListener('online', () => {
            updateSyncStatus(true);
            showToast('📶 Connexion rétablie', 'success');
        });
        
        window.addEventListener('offline', () => {
            updateSyncStatus(false);
            showToast('📶 Connexion perdue', 'warning');
        });
        
        // ============================================================
        // ⭐ NETTOYAGE AVANT FERMETURE
        // ============================================================
        window.addEventListener('beforeunload', () => {
            nettoyerListeners();
            if (anneeActiveUnsubscribe) {
                try { anneeActiveUnsubscribe(); } catch(e) {}
            }
        });
        
        // ============================================================
        // ⭐ INITIALISATION
        // ============================================================
        updateSyncStatus(navigator.onLine);
        
        window.loadView = loadView;
        window.showToast = showToast;
        
        console.log('✅ Espace Professeur SPA - Faculté Agronomique');
        console.log('📱 Application chargée avec succès');
        console.log(`⏰ Durée de session: ${SESSION_DUREE_HEURES} heures`);
        console.log(`📐 Nouvelle formule : TD/2.5 + TP/2.5 + Interro/5 (bonus +2 max) → Moyenne/10`);
    </script>
