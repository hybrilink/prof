    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { 
            --primary-blue: #003366; 
            --dark-blue: #002244; 
            --accent-yellow: #ffb347; 
            --light-gray: #f0f2f5;
            --success-green: #28a745;
        }
        
        body {

            flex-direction: column;
        }

        }

        .navbar-right { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        
        .profile-photo {
            width: 45px; height: 45px;

            display: flex; align-items: center; justify-content: center;

        }

        .prof-name-nav {
            color: white; font-weight: 500; font-size: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .prof-name-nav i { color: var(--accent-yellow); }
        
        .logout-btn {
            background: transparent; color: white;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 8px 15px; border-radius: 25px;
            font-weight: bold; transition: all 0.3s;
            cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
        
        .sync-status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .sync-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }
        .sync-badge.online { background: var(--success-green); color: white; }
        .sync-badge.offline { background: #ffc107; color: #333; }
        .sync-badge.cache { background: #17a2b8; color: white; }
        
        .last-sync-text { font-size: 11px; color: #888; }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: white;
            border-radius: 20px;

            box-shadow: 0 5px 15px rgba(0,0,0,0.08);

        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.15); }
        .stat-icon { font-size: 35px; color: var(--primary-blue); margin-bottom: 10px; }

        .content-card {

        .search-export-bar {

        .badge-etudiants {

        .cours-nom-cell { font-weight: 600; color: var(--primary-blue); }

        .empty-state { text-align: center; padding: 60px 20px; color: #888; }

        .toast-notification { position: fixed; top: 20px; right: 20px; z-index: 9999; min-width: 300px; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .offline-banner {

        .footer-info {

        .loading-spinner-small {

            border-top: 3px solid var(--primary-blue);

        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .cours-table thead th, .cours-table tbody td { padding: 10px 8px; font-size: 12px; }
            .content-card { padding: 15px; }
            .search-export-bar { padding: 10px; }
            .prof-name-nav { font-size: 12px; }
            .navbar-right { gap: 10px; }
        }
    </style>
</head>

    <script>
        // ============================================================
        // ⭐ CONFIGURATION FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBb82N2-5ns7qKjQBAj5UvDW87s2PZ27F0",
            authDomain: "fsa-unilu.firebaseapp.com",
            projectId: "fsa-unilu",
            storageBucket: "fsa-unilu.firebasestorage.app",
            messagingSenderId: "36551990738",
            appId: "1:36551990738:web:e91fdcb53f8aab5d1b7c0b"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
            console.warn('⚠️ Persistence non activée:', err);
        });

        // ============================================================
        // ⭐ CONSTANTES
        // ============================================================
        const SESSION_DUREE_HEURES = 24;
        const CACHE_KEY_COURS = 'cache_cours_professeur';
        const CACHE_KEY_PROMOS = 'cache_promotions';
        const CACHE_KEY_ETUDIANTS = 'cache_etudiants';
        const CACHE_KEY_LAST_SYNC = 'cache_last_sync';
        const CACHE_DURATION = 30 * 60 * 1000;

        // ============================================================
        // ⭐ VARIABLES
        // ============================================================
        let currentUser = null;
        let currentUserId = null;
        let allCours = [];
        let allPromotions = [];
        let allEtudiants = [];
        let searchTerm = '';
        let isOnline = navigator.onLine;
        let unsubscribeCours = null;
        let unsubscribePromotions = null;
        let unsubscribeEtudiants = null;
        let isLoading = true;

        // ============================================================
        // ⭐ SYSTÈME DE CACHE LOCAL
        // ============================================================
        class LocalCache {
            static set(key, data) {
                try {
                    const cacheData = { data: data, timestamp: Date.now() };
                    localStorage.setItem(key, JSON.stringify(cacheData));
                } catch(e) {
                    console.warn('Cache saturé');
                }
            }
            
            static get(key) {
                try {
                    const raw = localStorage.getItem(key);
                    if (!raw) return null;
                    return JSON.parse(raw);
                } catch(e) {
                    return null;
                }
            }
            
            static isValid(cacheData) {
                if (!cacheData) return false;
                return (Date.now() - cacheData.timestamp) < CACHE_DURATION;
            }
            
            static getDerniereSynchro() {
                const cacheData = LocalCache.get(CACHE_KEY_LAST_SYNC);
                if (cacheData && cacheData.data) {
                    return new Date(cacheData.data).toLocaleTimeString('fr-FR', {
                        hour: '2-digit', minute: '2-digit'
                    });
                }
                return null;
            }
        }

        // ============================================================
        // ⭐ VÉRIFICATION DE SESSION
        // ============================================================
        (function() {
            console.log('🔍 Vérification de la session...');
            
            const sessionData = localStorage.getItem('professeur_session');
            if (!sessionData) { 
                console.log('❌ Aucune session trouvée');
                window.location.href = 'login.html'; 
                return; 
            }
            
            try {
                const session = JSON.parse(sessionData);
                const now = Date.now();
                
                console.log('📦 Session brute:', session);
                
                // ✅ Vérifier directement les propriétés de session
                if (!session.role || session.role !== 'professeur') {
                    console.log('❌ Rôle non professeur:', session.role);
                    localStorage.removeItem('professeur_session');
                    window.location.href = 'login.html';
                    return;
                }
                
                if (!session.expires || now > session.expires) {
                    console.log('⏰ Session expirée');
                    localStorage.removeItem('professeur_session');
                    window.location.href = 'login.html';
                    return;
                }
                
                if (!session.verified2FA) {
                    console.log('❌ 2FA non vérifiée');
                    localStorage.removeItem('professeur_session');
                    window.location.href = 'login.html';
                    return;
                }
                
                // ✅ STOCKER DIRECTEMENT LA SESSION
                currentUser = session;
                currentUserId = session.id || session.uid;
                
                const nomComplet = session.nomComplet || 'Professeur';
                const specialite = session.specialite || '';
                const departement = session.departement || '';
                
                console.log('✅ Session valide - Bienvenue ' + nomComplet);
                console.log('🆔 ID professeur:', currentUserId);
                console.log('📚 Spécialité:', specialite);
                console.log('🏛️ Département:', departement);
                
                // === AFFICHAGE DANS LA NAVBAR ===
                const navName = document.getElementById('navProfessorName');
                if (navName) {
                    navName.textContent = nomComplet;
                    console.log('✅ Nom affiché dans navbar:', nomComplet);
                }
                
                const initials = nomComplet.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                const avatar = document.getElementById('profileAvatar');
                if (avatar) {
                    avatar.textContent = initials;
                    avatar.title = nomComplet + (specialite ? ' - ' + specialite : '');
                    console.log('✅ Avatar mis à jour:', initials);
                }
                
                document.title = 'Mes Cours - ' + nomComplet;
                
                // === CHARGEMENT DES DONNÉES ===
                console.log('🚀 Chargement des données...');
                chargerDepuisCache();
                initRealtime();
                
            } catch(e) {
                console.error('❌ Erreur session:', e);
                localStorage.removeItem('professeur_session');
                window.location.href = 'login.html';
            }
        })();

        // ============================================================
        // ⭐ CHARGEMENT DEPUIS LE CACHE
        // ============================================================
        function chargerDepuisCache() {
            const cacheCours = LocalCache.get(CACHE_KEY_COURS);
            const cachePromos = LocalCache.get(CACHE_KEY_PROMOS);
            const cacheEtudiants = LocalCache.get(CACHE_KEY_ETUDIANTS);
            
            let cacheUtilise = false;
            
            if (cachePromos && LocalCache.isValid(cachePromos)) {
                allPromotions = cachePromos.data;
                cacheUtilise = true;
                console.log('📦 Promotions chargées depuis le cache');
            }
            
            if (cacheEtudiants && LocalCache.isValid(cacheEtudiants)) {
                allEtudiants = cacheEtudiants.data;
                cacheUtilise = true;
                console.log('📦 Étudiants chargés depuis le cache');
            }
            
            if (cacheCours && LocalCache.isValid(cacheCours)) {
                allCours = cacheCours.data;
                cacheUtilise = true;
                console.log('📦 Cours chargés depuis le cache');
                isLoading = false;
                afficherCours();
                mettreAJourStats();
            }
            
            const derniereSynchro = LocalCache.getDerniereSynchro();
            if (derniereSynchro) {
                const lastSyncText = document.getElementById('lastSyncText');
                if (lastSyncText) {
                    lastSyncText.textContent = `Dernière synchro: ${derniereSynchro}`;
                }
            }
            
            if (cacheUtilise && !isOnline) {
                const badge = document.getElementById('syncBadge');
                if (badge) {
                    badge.className = 'sync-badge offline';
                    badge.innerHTML = '<i class="bi bi-circle-fill" style="font-size:8px;"></i> Hors-ligne (cache)';
                }
                const banner = document.getElementById('offlineBanner');
                if (banner) banner.classList.add('show');
            }
            
            return cacheUtilise;
        }

        // ============================================================
        // ⭐ ÉCOUTEURS TEMPS RÉEL + CACHE
        // ============================================================
        function initRealtime() {
            console.log('🔄 Initialisation des écouteurs temps réel...');
            
            // Écouteur promotions
            unsubscribePromotions = db.collection('promotions').onSnapshot((snapshot) => {
                allPromotions = [];
                snapshot.forEach(doc => {
                    allPromotions.push({ id: doc.id, ...doc.data() });
                });
                LocalCache.set(CACHE_KEY_PROMOS, allPromotions);
                afficherCours();
                mettreAJourStats();
                if (isLoading) isLoading = false;
            }, (error) => {
                console.error('❌ Erreur promotions:', error);
                const cachePromos = LocalCache.get(CACHE_KEY_PROMOS);
                if (cachePromos && cachePromos.data) allPromotions = cachePromos.data;
            });
            
            // Écouteur étudiants
            unsubscribeEtudiants = db.collection('etudiants').onSnapshot((snapshot) => {
                allEtudiants = [];
                snapshot.forEach(doc => {
                    allEtudiants.push({ id: doc.id, ...doc.data() });
                });
                LocalCache.set(CACHE_KEY_ETUDIANTS, allEtudiants);
                afficherCours();
                mettreAJourStats();
            }, (error) => {
                console.error('❌ Erreur étudiants:', error);
                const cacheEtudiants = LocalCache.get(CACHE_KEY_ETUDIANTS);
                if (cacheEtudiants && cacheEtudiants.data) allEtudiants = cacheEtudiants.data;
            });
            
            // ⭐ ÉCOUTEUR COURS AVEC FILTRAGE
            unsubscribeCours = db.collection('cours').onSnapshot((snapshot) => {
                console.log('📚 Mise à jour des cours en temps réel...');
                
                allCours = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    
                    // ✅ Vérifier si le cours appartient au professeur connecté
                    const isProfessorMatch = 
                        data.professeurId === currentUserId ||
                        data.professeurId === currentUser?.uid ||
                        (Array.isArray(data.professeurId) && data.professeurId.includes(currentUserId)) ||
                        (Array.isArray(data.professeurId) && data.professeurId.includes(currentUser?.uid));
                    
                    if (isProfessorMatch) {
                        allCours.push({ id: doc.id, ...data });
                    }
                });
                
                // Tri par date décroissante (plus récent en premier)
                allCours.sort((a, b) => {
                    const da = a.dateCreation?.toDate?.() || new Date(0);
                    const db2 = b.dateCreation?.toDate?.() || new Date(0);
                    return db2 - da;
                });
                
                // Mettre en cache
                LocalCache.set(CACHE_KEY_COURS, allCours);
                LocalCache.set(CACHE_KEY_LAST_SYNC, Date.now());
                
                // Mettre à jour l'UI
                mettreAJourStatutConnexion(true);
                afficherCours();
                mettreAJourStats();
                mettreAJourDerniereSynchro();
                
                if (isLoading) isLoading = false;
                console.log(`✅ ${allCours.length} cours chargés pour le professeur`);
                
            }, (error) => {
                console.error('❌ Erreur écoute cours:', error);
                mettreAJourStatutConnexion(false);
                const cacheCours = LocalCache.get(CACHE_KEY_COURS);
                if (cacheCours && cacheCours.data) {
                    allCours = cacheCours.data;
                    const banner = document.getElementById('offlineBanner');
                    if (banner) banner.classList.add('show');
                    afficherCours();
                    mettreAJourStats();
                }
            });
        }

        // ============================================================
        // ⭐ GESTION DE LA CONNEXION
        // ============================================================
        function mettreAJourStatutConnexion(online) {
            isOnline = online;
            const badge = document.getElementById('syncBadge');
            const banner = document.getElementById('offlineBanner');
            
            if (online) {
                if (badge) {
                    badge.className = 'sync-badge online';
                    badge.innerHTML = '<i class="bi bi-circle-fill" style="font-size:8px;"></i> En ligne';
                }
                if (banner) banner.classList.remove('show');
            } else {
                if (badge) {
                    badge.className = 'sync-badge offline';
                    badge.innerHTML = '<i class="bi bi-circle-fill" style="font-size:8px;"></i> Hors-ligne (cache)';
                }
                if (banner) banner.classList.add('show');
            }
        }

        function mettreAJourDerniereSynchro() {
            const derniereSynchro = LocalCache.getDerniereSynchro();
            const lastSyncText = document.getElementById('lastSyncText');
            if (lastSyncText && derniereSynchro) {
                lastSyncText.textContent = `Dernière synchro: ${derniereSynchro}`;
            }
        }

        window.addEventListener('online', () => {
            mettreAJourStatutConnexion(true);
            showToast('📶 Connexion rétablie', 'success');
        });

        window.addEventListener('offline', () => {
            mettreAJourStatutConnexion(false);
            showToast('📶 Connexion perdue - Mode hors-ligne', 'warning');
        });

        // ============================================================
        // ⭐ FONCTIONS D'AFFICHAGE
        // ============================================================
        function escapeHtml(t) { 
            if (!t) return ''; 
            const d = document.createElement('div'); 
            d.textContent = t; 
            return d.innerHTML; 
        }

        function formaterDate(timestamp) {
            if (!timestamp) return 'Date inconnue';
            try {
                const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                return date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
            } catch(e) { 
                return 'Date invalide'; 
            }
        }

        function getCoursFiltres() {
            if (!searchTerm) return allCours;
            const term = searchTerm.toLowerCase();
            const promoMap = {};
            allPromotions.forEach(p => promoMap[p.id] = (p.nom || '').toLowerCase());
            
            return allCours.filter(c => {
                return (c.nom || '').toLowerCase().includes(term) ||
                       (c.promotionNom || promoMap[c.promotionId] || '').toLowerCase().includes(term) ||
                       (c.professeurNom || '').toLowerCase().includes(term) ||
                       (c.code || '').toLowerCase().includes(term);
            });
        }

        function afficherCours() {
            const container = document.getElementById('coursContainer');
            if (!container) return;
            
            const coursFiltres = getCoursFiltres();
            const resultCount = document.getElementById('resultCount');
            if (resultCount) {
                resultCount.textContent = allCours.length > 0 ? 
                    `${coursFiltres.length} cours affiché(s) sur ${allCours.length}` : '';
            }
            
            if (isLoading) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <h5>Chargement...</h5>
                        <p>Récupération des données en cours...</p>
                        <div class="loading-spinner-small mt-2"></div>
                    </div>`;
                return;
            }
            
            if (allCours.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <h5>Aucun cours assigné</h5>
                        <p>Les cours qui vous sont assignés apparaîtront ici en temps réel.</p>
                        <p class="text-muted small mt-2">ID professeur: ${currentUserId?.substring(0, 8) || 'N/A'}</p>
                    </div>`;
                return;
            }
            
            if (coursFiltres.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-search"></i>
                        <h5>Aucun résultat</h5>
                        <p>Aucun cours ne correspond à "${escapeHtml(searchTerm)}".</p>
                        <button class="btn btn-sm btn-outline-primary mt-3" onclick="resetRecherche()">
                            <i class="bi bi-arrow-counterclockwise"></i> Réinitialiser
                        </button>
                    </div>`;
                return;
            }
            
            const promoMap = {};
            allPromotions.forEach(p => promoMap[p.id] = p.nom);
            
            let html = `
                <div class="table-responsive">
                    <table class="cours-table">
                        <thead>
                            <tr>
                                <th style="width:50px;">N°</th>
                                <th>Nom du cours</th>
                                <th style="width:100px;">Crédits</th>
                                <th>Promotion</th>
                                <th style="width:120px;">Étudiants</th>
                                <th>Professeur</th>
                                <th style="width:130px;">Date création</th>
                            </tr>
                        </thead>
                        <tbody>`;
            
            coursFiltres.forEach((cours, i) => {
                const promoNom = promoMap[cours.promotionId] || cours.promotionNom || 'N/A';
                const nbEtudiants = allEtudiants.filter(e => e.promotion === cours.promotionId).length;
                const codeCours = cours.code ? ` [${cours.code}]` : '';
                
                html += `
                    <tr>
                        <td style="text-align:center;font-weight:bold;color:#888;">${i + 1}</td>
                        <td class="cours-nom-cell">
                            <i class="bi bi-book-fill"></i> 
                            ${escapeHtml(cours.nom)}${escapeHtml(codeCours)}
                        </td>
                        <td style="text-align:center;">
                            <span class="badge-credit"><i class="bi bi-star-fill"></i> ${cours.credits || 0}</span>
                        </td>
                        <td>
                            <span class="badge-promo"><i class="bi bi-trophy-fill"></i> ${escapeHtml(promoNom)}</span>
                        </td>
                        <td style="text-align:center;">
                            <span class="badge-etudiants"><i class="bi bi-people-fill"></i> ${nbEtudiants}</span>
                        </td>
                        <td>
                            <i class="bi bi-person-badge" style="color:var(--primary-blue);"></i> 
                            ${escapeHtml(cours.professeurNom || 'N/A')}
                        </td>
                        <td>
                            <span class="badge-date"><i class="bi bi-calendar-check"></i> ${formaterDate(cours.dateCreation)}</span>
                        </td>
                    </tr>`;
            });
            
            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function resetRecherche() {
            const searchInput = document.getElementById('searchCours');
            if (searchInput) {
                searchInput.value = '';
                searchTerm = '';
                const clearBtn = document.getElementById('clearSearchCours');
                if (clearBtn) clearBtn.style.display = 'none';
                afficherCours();
                searchInput.focus();
            }
        }

        function mettreAJourStats() {
            const totalCours = document.getElementById('totalCours');
            const totalCredits = document.getElementById('totalCredits');
            const totalPromotions = document.getElementById('totalPromotions');
            const totalEtudiants = document.getElementById('totalEtudiants');
            
            if (totalCours) totalCours.textContent = allCours.length;
            if (totalCredits) totalCredits.textContent = allCours.reduce((s, c) => s + (c.credits || 0), 0);
            if (totalPromotions) {
                const promosUniques = new Set(allCours.map(c => c.promotionId));
                totalPromotions.textContent = promosUniques.size;
            }
            if (totalEtudiants) {
                let totalEt = 0;
                const promosUniques = new Set(allCours.map(c => c.promotionId));
                promosUniques.forEach(pid => { 
                    totalEt += allEtudiants.filter(e => e.promotion === pid).length; 
                });
                totalEtudiants.textContent = totalEt;
            }
        }

        // ============================================================
        // ⭐ RECHERCHE
        // ============================================================
        document.getElementById('searchCours').addEventListener('input', function(e) {
            searchTerm = e.target.value;
            const clearBtn = document.getElementById('clearSearchCours');
            if (clearBtn) clearBtn.style.display = searchTerm ? 'block' : 'none';
            afficherCours();
        });

        document.getElementById('clearSearchCours').addEventListener('click', resetRecherche);

        // ============================================================
        // ⭐ FONCTION TOAST
        // ============================================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            
            const bgColor = type === 'success' ? '#28a745' : 
                           type === 'warning' ? '#ffc107' : 
                           type === 'info' ? '#17a2b8' : '#dc3545';
            const textColor = type === 'warning' ? '#333' : 'white';
            const icon = type === 'success' ? 'check-circle-fill' : 
                        type === 'warning' ? 'exclamation-triangle-fill' : 
                        type === 'info' ? 'info-circle-fill' : 'x-circle-fill';
            
            const toastHtml = `
                <div class="toast notification-toast" style="background:${bgColor};color:${textColor};border-radius:10px;margin-bottom:10px;box-shadow:0 5px 15px rgba(0,0,0,0.2);">
                    <div class="toast-body" style="padding:12px 20px;">
                        <i class="bi bi-${icon} me-2"></i>
                        ${message}
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('afterbegin', toastHtml);
            setTimeout(() => {
                if (container.firstElementChild) container.firstElementChild.remove();
            }, 4000);
        }

        // ============================================================
        // ⭐ DÉCONNEXION
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('Voulez-vous vous déconnecter ?')) {
                if (unsubscribeCours) unsubscribeCours();
                if (unsubscribePromotions) unsubscribePromotions();
                if (unsubscribeEtudiants) unsubscribeEtudiants();
                localStorage.removeItem('professeur_session');
                window.location.href = 'login.html';
            }
        });

        // ============================================================
        // ⭐ CLIC SUR L'AVATAR
        // ============================================================
        document.getElementById('profileAvatar').addEventListener('click', function() {
            window.location.href = 'profil.html';
        });

        // ============================================================
        // ⭐ NETTOYAGE
        // ============================================================
        window.addEventListener('beforeunload', () => {
            if (unsubscribeCours) unsubscribeCours();
            if (unsubscribePromotions) unsubscribePromotions();
            if (unsubscribeEtudiants) unsubscribeEtudiants();
        });

        // ============================================================
        // ⭐ INITIALISATION
        // ============================================================
        console.log('✅ Page Mes Cours - Temps réel + Cache local activé');
        console.log(`⏰ Session: ${SESSION_DUREE_HEURES} heures`);
        console.log(`📦 Cache valable: ${CACHE_DURATION / 60000} minutes`);
        console.log(`👤 ID professeur: ${currentUserId}`);
        
        window.showToast = showToast;
        window.resetRecherche = resetRecherche;
        
        setTimeout(() => {
            const nom = currentUser?.nomComplet || 'Professeur';
            showToast(`👋 Bienvenue ${nom} - Mes Cours`, 'success');
        }, 800);
    </script>
</body>
</html>
